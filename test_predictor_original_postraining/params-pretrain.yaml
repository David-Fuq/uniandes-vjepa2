app: vjepa_droid
cpus_per_task: 12
data:
  batch_size: 1
  camera_views:
  - left_mp4_path
  crop_size: 256
  dataset_fpcs:
  - 8
  datasets:
  - postraining_uniandes/datasets/droid_index_10_pcs.csv
  fps: 4
  num_workers: 8
  patch_size: 16
  pin_mem: true
  stereo_view: false
  tubelet_size: 2
data_aug:
  auto_augment: false
  horizontal_flip: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 1.777
  - 1.777
  reprob: 0.0
folder: ./test_predictor_original_postraining
loss:
  auto_steps: 2
  loss_exp: 1.0
  normalize_reps: true
  reg_coeff: 0.0
mem_per_gpu: 48G
meta:
  context_encoder_key: model
  dtype: bfloat16
  eval_freq: 100
  load_predictor: false
  pretrain_checkpoint: ./vjepa2_checkpoints/vitg.pt
  resume_checkpoint: null
  save_every_freq: 25
  seed: 239
  target_encoder_key: model
  use_sdpa: true
model:
  model_name: vit_giant_xformers
  pred_depth: 24
  pred_embed_dim: 1024
  pred_is_frame_causal: true
  pred_num_heads: 16
  uniform_power: true
  use_activation_checkpointing: true
  use_extrinsics: false
  use_rope: true
nodes: 1
optimization:
  anneal: 15
  epochs: 10
  final_lr: 0.0
  final_weight_decay: 0.04
  ipe: 300
  lr: 0.000425
  start_lr: 7.5e-05
  warmup: 15
  weight_decay: 0.04
tasks_per_node: 1
